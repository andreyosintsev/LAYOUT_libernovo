<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Video Text Block</title>
    <link rel="stylesheet" href="../../css/common/normalize.css">
    <link rel="stylesheet" href="../../css/common/consts.css">
    <link rel="stylesheet" href="css/grid-video-text.css">
</head>

<body style="background-color: yellowgreen; padding: 10px;">
    <div class="grid-video-text">
        <div class="grid-video-text__text">
            <h2 class="section-title grid-video-text__title">Manual Lumbar Adjustment, Tailored to Every Spine</h2>
            <p class="grid-video-text__item-text">
                Adjust the lumbar support bar manually, working in sync with the Bionic FlexFit Backrest to create
                multiple S-shaped support profiles that adapt to your spine across every recline position.
            </p>
        </div>
        <div class="grid-video-text__video">
            <video class="grid-video-text__player" controls autoplay playsinline muted loop>
                <source src="video/01.mp4" type="video/mp4">
                <source src="video/01.webm" type="video/webm">
                Ваш браузер не поддерживает видео
            </video>
        </div>
    </div>
</body>

</html>
