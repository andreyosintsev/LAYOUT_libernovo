<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Images Block</title>
    <link rel="stylesheet" href="../../css/common/normalize.css">
    <link rel="stylesheet" href="../../css/common/consts.css">
    <link rel="stylesheet" href="css/grid-images.css">
</head>

<body style="background-color: yellowgreen; padding: 10px;">
    <div class="grid-images grid-images_se">
        <div class="grid-images__row grid-images__row_se grid-images__row_se-first">
            <div class="grid-images__cell grid-images__cell_se grid-images__cell_10">
                <img class="grid-images__image" src="images/se/01.webp" alt="grid-image-01">
                <div class="grid-images__text grid-images__text_se">
                    Manual Lumbar Adjustment
                </div>
            </div>
            <div class="grid-images__cell grid-images__cell_se grid-images__cell_11">
                <img class="grid-images__image" src="images/se/02.webp" alt="grid-image-02">
                <div class="grid-images__text grid-images__text_se">
                    Бионическая спинка FlexFit
                </div>
            </div>
        </div>
        <div class="grid-images__row grid-images__row_se grid-images__row_se-second">
            <div class="grid-images__cell grid-images__cell_se grid-images__cell_20">
                <img class="grid-images__image" src="images/se/03.webp" alt="grid-image-03">
                <div class="grid-images__text grid-images__text_se grid-images__text_white">
                    Зональная поддержка, комфорт в течение дня
                </div>
            </div>
            <div class="grid-images__cell grid-images__cell_se grid-images__cell_21">
                <img class="grid-images__image" src="images/se/04.webp" alt="grid-image-04">
                <div class="grid-images__text grid-images__text_se">
                    Five Lockable Recline Positions
                </div>
            </div>
            <div class="grid-images__cell grid-images__cell_se grid-images__cell_22">
                <img class="grid-images__image" src="images/se/05.webp" alt="grid-image-05">
                <div class="grid-images__text grid-images__text_se">
                    Динамическая поддержка
                </div>
            </div>
        </div>
    </div>
</body>

</html>
