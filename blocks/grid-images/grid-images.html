<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Images Block</title>
    <link rel="stylesheet" href="../../css/common/normalize.css">
    <link rel="stylesheet" href="../../css/common/consts.css">
    <link rel="stylesheet" href="css/grid-images.css">
</head>

<body style="background-color: yellowgreen; padding: 10px;">
    <div class="grid-images">
        <div class="grid-images__block">
            <div class="grid-images__cell" style="grid-area: cell1;">
                <img class="grid-images__image" src="images/grid-images-01.webp" alt="grid-image-01">
                <div class="grid-images__text">
                    Динамическая поддержка
                </div>
            </div>
            <div class="grid-images__cell" style="grid-area: cell2;">
                <img class="grid-images__image" src="images/grid-images-02.webp" alt="grid-image-02">
                <div class="grid-images__text grid-images__text_white">
                    Бионическая спинка FlexFit
                </div>
            </div>
            <div class="grid-images__cell" style="grid-area: cell3;">
                <img class="grid-images__image" src="images/grid-images-03.webp" alt="grid-image-03">
                <div class="grid-images__text grid-images__text_white">
                    Моторизованное растяжение позвоночника
                </div>
            </div>
        </div>
        <div class="grid-images__row">
            <div class="grid-images__cell">
                <img class="grid-images__image" src="images/grid-images-04.webp" alt="grid-image-04">
                <div class="grid-images__text">
                    <b>105&deg; - 160&deg; для любых задач</b><br>
                    *4 угла наклона cпинка модели Omni<br>
                    (105&deg;, 120&deg;, 135&deg;, 160&deg;)
                </div>
            </div>
            <div class="grid-images__cell">
                <img class="grid-images__image" src="images/grid-images-05.jpg" alt="grid-image-05">
                <div class="grid-images__text grid-images__text_white">
                    Зональная поддержка, комфорт в течение дня
                </div>
            </div>
            <div class="grid-images__cell">
                <img class="grid-images__image" src="images/grid-images-06.webp" alt="grid-image-06">
                <div class="grid-images__text">
                    2200 мАч, 12 В, заряд на 30 дней
                </div>
            </div>
        </div>
    </div>
</body>

</html>
