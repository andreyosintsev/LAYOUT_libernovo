<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Image Text Block</title>
    <link rel="stylesheet" href="../../css/common/normalize.css">
    <link rel="stylesheet" href="../../css/common/consts.css">
    <link rel="stylesheet" href="../section-title/css/section-title.css">
    <link rel="stylesheet" href="css/flex-image-text.css">
</head>
<body style="background-color: yellowgreen; padding: 10px;">
    <div class="flex-image-text flex-image-text_reverse">
        <div class="flex-image-text__item flex-image-text__item_flex-end">
            <img class="flex-image-text__image"
                src="images/01.webp"
                alt="Stylish and practical"
                title="Stylish and practical">
            </img>
        </div>
        <div class="flex-image-text__item">
            <div class="flex-image-text__text flex-image-text__text_bubble">
                <h2 class="section-title flex-image-text__title">Micro-elastic fabric</h2>
                <div class="flex-image-text__list-item">
                    <img class="flex-image-text__bullet" src="images/sign-abrasion.png" alt="Abrasion Resistance">
                    <p class="flex-image-text__item-text">
                        Abrasion Resistance: >50,000 Rubs
                    </p>
                </div>
                <div class="flex-image-text__list-item">
                    <img class="flex-image-text__bullet" src="images/sign-pilling.png" alt="Pilling Resistance">
                    <p class="flex-image-text__item-text">
                        Pilling Resistance: Grade 4 at 5,000 Rubs
                    </p>
                </div>
                <div class="flex-image-text__list-item">
                    <img class="flex-image-text__bullet" src="images/sign-fastness.png" alt="Color Fastness to Rubbing">
                    <p class="flex-image-text__item-text">
                        Color Fastness to Rubbing: Grade 4 (Dry Rub), Grade 3-4 (Wet Rub)
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
